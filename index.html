<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>QUẢN LÝ SINH VIÊN</h1>

        <div class="form-add">
            <h2>Thêm sinh viên</h2>

            <input type="text" id="student-id" placeholder="Mã sinh viên">

            <input type="text" id="student-name" placeholder="Họ tên">

            <input type="text" id="student-class" placeholder="Lớp">

            <button onclick="addStudent()">Thêm sinh viên</button>
        </div>


        <h2>Danh sách sinh viên</h2>

        <table>
            <thead>
                <tr>
                    <th>Mã sinh viên</th>
                    <th>Họ tên</th>
                    <th>Lớp</th>
                </tr>
            </thead>
            <tbody id="student-list"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>

</html>
